name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin to the Flutter version the plugin is developed against. Bump deliberately.
  FLUTTER_VERSION: "3.44.5"

jobs:
  analyze-test-android:
    name: Analyze · test · Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Validates pubspec/CHANGELOG/LICENSE/packaging without publishing — catches release-breaking
      # metadata before an (irreversible) `flutter pub publish`.
      - name: Publish dry-run
        run: flutter pub publish --dry-run

      - name: Build example (Android APK, debug)
        working-directory: example
        run: flutter build apk --debug

  ios-build:
    name: iOS build (no codesign)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # LANG/LC_ALL avoid the CocoaPods "ASCII-8BIT" Ruby locale crash. `flutter build ios` runs
      # `pod install` internally; if the CocoaPods CDN lags right after a new LinkTrailSDK release,
      # add a `pod repo update` step here.
      - name: Build example (iOS, no codesign)
        working-directory: example
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: flutter build ios --no-codesign --debug
