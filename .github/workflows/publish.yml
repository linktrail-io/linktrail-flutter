name: Publish to pub.dev

# Follows https://dart.dev/tools/pub/automated-publishing (Flutter packages section):
# setup-dart configures the GitHub OIDC token for pub.dev, flutter-action provides the Flutter SDK.
# The reusable dart-lang/setup-dart publish workflow only runs `dart pub`, so it can't publish a plugin.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

env:
  FLUTTER_VERSION: "3.44.5"

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Optional: add `environment: pub.dev` here if pub.dev is set to require that GitHub environment.
    permissions:
      id-token: write # pub.dev OIDC authentication
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c # v1.7.1

      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Check tag matches pubspec version and CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tag_version="${TAG#v}"
          pubspec_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '"'"'"' \r')"
          if [ "$tag_version" != "$pubspec_version" ]; then
            echo "::error::Tag $TAG does not match pubspec.yaml version $pubspec_version"
            exit 1
          fi
          if ! grep -Eq "^## \[?${tag_version//./\\.}\]?([[:space:]]|$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $tag_version' entry"
            exit 1
          fi
          echo "Version $tag_version OK"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter pub publish --dry-run
      - run: flutter pub publish --force
